[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-rule-grounding"
version = "0.1.0"
description = "Controlled evaluation of written rule application to visual evidence"
requires-python = ">=3.11"
dependencies = ["Pillow>=10.1,<14"]

[tool.setuptools.packages.find]
include = ["visual_rules*"]
